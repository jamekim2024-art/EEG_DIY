; ESP32-WROOM-32 biosignal acquisition (neuro-project)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
  adafruit/Adafruit ADS1X15 @ ^2.5.0
  adafruit/Adafruit BusIO @ ^1.16.0

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DOUTPUT_PLOTTER=1
