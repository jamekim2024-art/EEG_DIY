; ============================================================
; Arduino Mega 2560 R3 — LCD / LED / buzzer status panel
; ============================================================

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_filters = time

; Explicit dependency — AVR Arduino core may not expose built-in LiquidCrystal to LDF
lib_deps =
  arduino-libraries/LiquidCrystal @ ^1.0.7
