; ============================================================
; ESP32-WROOM-32 biosignal acquisition firmware
; Board: ESP32 Dev Module (WROOM-32)
; ============================================================

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time

; Keep upload reliable on boards that need BOOT button timing
upload_speed = 115200

lib_deps =
  adafruit/Adafruit ADS1X15 @ ^2.5.0
  adafruit/Adafruit BusIO @ ^1.16.0

build_flags =
  -DCORE_DEBUG_LEVEL=0
